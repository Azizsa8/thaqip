services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thaqip
      POSTGRES_PASSWORD: thaqip_dev
      POSTGRES_DB: thaqip
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thaqip
      MINIO_ROOT_PASSWORD: thaqip_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
