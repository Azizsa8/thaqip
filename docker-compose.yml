services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thaqip
      POSTGRES_PASSWORD: thaqip_dev
      POSTGRES_DB: thaqip
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thaqip
      MINIO_ROOT_PASSWORD: thaqip_dev_secret
    ports: ["9002:9000", "9003:9001"]
    volumes:
      - miniodata:/data
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir", "/data", "--api-key", "thaqip_dev_search"]
    ports: ["8108:8108"]
    volumes:
      - tsdata:/data
    restart: unless-stopped

  poller:
    build: ./services/ingestion
    command: ["python", "-m", "thaqip_ingestion.main", "--loop", "--every", "300", "--pages", "6"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
    depends_on: [postgres]
    restart: unless-stopped

  relay:
    build: ./services/ingestion
    command: ["python", "-m", "thaqip_ingestion.relay", "--interval", "2"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    restart: unless-stopped

  alerts:
    build: ./services/ingestion
    command: ["python", "-m", "thaqip_ingestion.alerts"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on: [postgres, redis]
    restart: unless-stopped

  indexer:
    build: ./services/ingestion
    command: ["python", "-m", "thaqip_ingestion.indexer"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
      REDIS_URL: redis://redis:6379/0
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_KEY: thaqip_dev_search
    depends_on: [postgres, redis, typesense]
    restart: unless-stopped

  pricing-seed:
    build: ./services/ingestion
    command: ["sh", "-c", "while true; do python -m thaqip_ingestion.pricing_seed --limit $${THAQIP_PRICING_SEED_LIMIT:-100}; sleep $${THAQIP_PRICING_SEED_INTERVAL:-21600}; done"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
    depends_on: [postgres]
    restart: unless-stopped

  ops-health:
    build: ./services/ingestion
    command: ["sh", "-c", "while true; do python -m thaqip_ingestion.ops_health --close-stalled; sleep $${THAQIP_OPS_HEALTH_INTERVAL:-3600}; done"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
    depends_on: [postgres]
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: services/console/Dockerfile
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_KEY: thaqip_dev_search
    ports:
      # Unauthenticated API: it will return a tenant's estimated_cost and bid
      # scenarios to any caller. Published on 0.0.0.0 + [::] it was reachable
      # on the LAN, over Tailscale, AND on this host's public IPv6 address,
      # with ufw inactive (verified 2026-09-10). Docker publishes ports through
      # its own iptables chain and bypasses ufw, so the firewall is not the
      # control here — the bind address is. Loopback for local work, Tailscale
      # for the owner's other devices, nothing else. Revisit once auth ships.
      - "127.0.0.1:8091:8080"
      - "100.86.158.23:8091:8080"   # tailscale0
    depends_on: [postgres]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  redisdata:
  tsdata:
