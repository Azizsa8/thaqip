services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thaqip
      POSTGRES_PASSWORD: thaqip_dev
      POSTGRES_DB: thaqip
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thaqip
      MINIO_ROOT_PASSWORD: thaqip_dev_secret
    ports: ["9002:9000", "9003:9001"]
    volumes:
      - miniodata:/data

  poller:
    build: ./services/ingestion
    command: ["python", "-m", "thaqip_ingestion.main", "--loop", "--every", "300", "--pages", "3"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
    depends_on: [postgres]
    restart: unless-stopped

  relay:
    build: ./services/ingestion
    command: ["python", "-m", "thaqip_ingestion.relay", "--interval", "2"]
    environment:
      DATABASE_URL: postgres://thaqip:thaqip_dev@postgres:5432/thaqip
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
