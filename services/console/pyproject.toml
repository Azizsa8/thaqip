[project]
name = "thaqip-console"
version = "0.1.0"
description = "Thaqip internal console: read-only UI over the tender corpus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "minio>=7.2.20",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "openpyxl>=3.1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thaqip_console"]
