<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثاقب — وحدة التحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f6f7f5; --ink:#1c2622; --muted:#5c6a63; --line:#dde2dd;
  --card:#ffffff; --accent:#0e6b4f; --accent-soft:#e3efe9;
  --win:#0e6b4f; --warn:#a63d2f; --amber:#8a6414; --amber-soft:#f3ecd9;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141a17; --ink:#e6ebe7; --muted:#9aa8a0; --line:#2b342f;
    --card:#1b231f; --accent:#4fb08d; --accent-soft:#1e2f28;
    --win:#4fb08d; --warn:#e08a77; --amber:#d0a84e; --amber-soft:#2e2818;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px;line-height:1.7}
header{display:flex;align-items:baseline;gap:14px;padding:14px 22px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
header h1{font-size:20px;margin:0}
header h1 span{color:var(--accent)}
header .env{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
#stats{display:flex;gap:10px;padding:14px 22px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 16px;min-width:110px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
#controls{display:flex;gap:8px;padding:0 22px 12px;flex-wrap:wrap;align-items:center}
input,select,button{font-family:inherit;font-size:13.5px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 11px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
#q{min-width:260px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
label.chk{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px}
main{padding:0 22px 40px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:840px}
th{font-size:11.5px;color:var(--muted);text-align:right;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.name{max-width:420px}
.pill{display:inline-block;font-size:11px;border-radius:99px;padding:1px 9px;font-weight:500}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.won{background:var(--amber-soft);color:var(--amber)}
.pill.closed{color:var(--muted);border:1px solid var(--line)}
#count{color:var(--muted);font-size:12.5px;padding:8px 2px}
#pager{display:flex;gap:8px;padding:12px 0}
/* detail drawer */
#drawer{position:fixed;top:0;left:0;height:100vh;width:min(560px,94vw);background:var(--card);border-right:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s;overflow-y:auto;padding:20px 22px;z-index:10}
#drawer.open{transform:none}
#drawer h2{font-size:16px;margin:4px 0 12px;line-height:1.5}
#drawer .close{position:absolute;top:12px;left:14px}
dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13px;margin:0 0 16px}
dt{color:var(--muted)}
dd{margin:0}
h3{font-size:13.5px;margin:18px 0 8px;color:var(--accent)}
.offers td,.offers th{padding:6px 10px;font-size:13px}
@media (prefers-reduced-motion: reduce){#drawer{transition:none}}
</style>
</head>
<body>
<header>
  <h1>ثاقب <span>·</span> وحدة التحكم</h1>
  <span class="env">بيئة تطوير — بيانات اعتماد الحية</span>
  <span class="env" id="fresh"></span>
</header>

<div id="stats"></div>

<div id="controls">
  <input id="q" type="search" placeholder="ابحث بالاسم أو الرقم المرجعي…">
  <select id="agency"><option value="">كل الجهات</option></select>
  <select id="activity"><option value="">كل الأنشطة</option></select>
  <label class="chk"><input type="checkbox" id="awarded"> مُرسّاة فقط</label>
  <label class="chk"><input type="checkbox" id="open"> مفتوحة فقط</label>
  <button class="primary" id="go">بحث</button>
</div>

<main>
  <div id="count"></div>
  <div class="tblwrap"><table>
    <thead><tr>
      <th>الرقم المرجعي</th><th>المنافسة</th><th>الجهة</th><th>النشاط</th>
      <th>الحالة</th><th>آخر تقديم</th><th>زمن الرصد</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="pager">
    <button id="prev">السابق</button>
    <button id="next">التالي</button>
  </div>
</main>

<aside id="drawer" aria-hidden="true">
  <button class="close" onclick="closeDrawer()">✕ إغلاق</button>
  <div id="detail"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
let offset = 0; const limit = 50;

const fmtDT = v => v ? new Date(v).toLocaleString('ar-SA-u-ca-gregory',{dateStyle:'short',timeStyle:'short'}) : '—';
const fmtMoney = v => v == null ? '—' : Number(v).toLocaleString('en-US');
function latency(pub, det){
  if(!pub || !det) return '—';
  const s = (new Date(det) - new Date(pub))/1000;
  if(s < 0) return '—';
  if(s < 3600) return Math.round(s/60) + ' د';
  return (s/3600).toFixed(1) + ' س';
}

async function loadStats(){
  const s = await (await fetch('/api/stats')).json();
  const cards = [
    ['المنافسات', s.tenders], ['مفتوحة الآن', s.open_tenders], ['الجهات', s.agencies],
    ['الموردون', s.vendors], ['العروض', s.offers], ['الترسيات', s.awards], ['الأحداث', s.events],
  ];
  $('#stats').innerHTML = cards.map(([k,v]) =>
    `<div class="stat"><b>${Number(v).toLocaleString('en-US')}</b><span>${k}</span></div>`).join('');
  if(s.fresh_p50_seconds != null){
    const m = Math.round(s.fresh_p50_seconds/60);
    $('#fresh').textContent = `وسيط زمن الرصد (24س): ${m < 60 ? m + ' دقيقة' : (m/60).toFixed(1) + ' ساعة'}`;
  }
}

async function loadFilters(){
  const f = await (await fetch('/api/filters')).json();
  $('#agency').insertAdjacentHTML('beforeend',
    f.agencies.map(a=>`<option value="${a.id}">${a.canonical_name} (${a.n})</option>`).join(''));
  $('#activity').insertAdjacentHTML('beforeend',
    f.activities.map(a=>`<option value="${a.id}">${a.name} (${a.n})</option>`).join(''));
}

async function loadTenders(){
  const p = new URLSearchParams({limit, offset});
  if($('#q').value) p.set('q', $('#q').value);
  if($('#agency').value) p.set('agency_id', $('#agency').value);
  if($('#activity').value) p.set('activity_id', $('#activity').value);
  if($('#awarded').checked) p.set('awarded','true');
  if($('#open').checked) p.set('open_only','true');
  const d = await (await fetch('/api/tenders?'+p)).json();
  $('#count').textContent = `${d.total.toLocaleString('en-US')} منافسة — عرض ${offset+1}–${offset+d.items.length}`;
  $('#rows').innerHTML = d.items.map(t=>{
    const st = t.has_award ? '<span class="pill won">مُرسّاة</span>'
             : t.remaining_s > 0 ? '<span class="pill open">مفتوحة</span>'
             : '<span class="pill closed">منتهية</span>';
    return `<tr class="row" onclick="openDetail(${t.id})">
      <td class="mono">${t.reference_number??''}</td>
      <td class="name">${t.name??''}</td>
      <td>${t.agency??''}</td>
      <td>${t.activity??''}</td>
      <td>${st}</td>
      <td class="mono">${fmtDT(t.last_offer_date)}</td>
      <td class="mono">${latency(t.published_at, t.detected_at)}</td>
    </tr>`;
  }).join('');
  $('#prev').disabled = offset === 0;
  $('#next').disabled = offset + limit >= d.total;
}

async function openDetail(id){
  const t = await (await fetch('/api/tenders/'+id)).json();
  const offers = t.offers.length ? `
    <h3>العروض المقدمة (${t.offers.length})</h3>
    <div class="tblwrap"><table class="offers">
      <thead><tr><th>المورد</th><th>قيمة العرض</th><th>فني</th><th>فائز</th></tr></thead>
      <tbody>${t.offers.map(o=>`<tr>
        <td>${o.vendor??o.vendor_name_raw??''}</td>
        <td class="mono">${fmtMoney(o.offer_value)}</td>
        <td>${o.technical_pass===true?'مطابق':'—'}</td>
        <td>${o.is_winner?'⭐':''}</td></tr>`).join('')}
      </tbody></table></div>` : '<h3>العروض</h3><p style="color:var(--muted)">لم تُحصد بعد أو لم تُعلن الترسية.</p>';
  const awards = t.awards.length ? `
    <h3>الترسية</h3>${t.awards.map(a=>`<p><b>${a.vendor??''}</b> — <span class="mono">${fmtMoney(a.award_value)} ر.س</span></p>`).join('')}` : '';
  $('#detail').innerHTML = `
    <h2>${t.name??''}</h2>
    <dl>
      <dt>الرقم المرجعي</dt><dd class="mono">${t.reference_number??''}</dd>
      <dt>الجهة</dt><dd>${t.agency??''}</dd>
      <dt>الفرع</dt><dd>${t.branch_name??'—'}</dd>
      <dt>النشاط</dt><dd>${t.activity_name_raw??'—'}</dd>
      <dt>نوع المنافسة</dt><dd>${t.tender_type_name??'—'}</dd>
      <dt>قيمة الكراسة</dt><dd class="mono">${fmtMoney(t.booklet_price)}</dd>
      <dt>النشر</dt><dd class="mono">${fmtDT(t.published_at)}</dd>
      <dt>آخر استفسارات</dt><dd class="mono">${fmtDT(t.last_enquiries_date)} <span style="color:var(--muted)">${t.last_enquiries_date_hijri??''}</span></dd>
      <dt>آخر تقديم</dt><dd class="mono">${fmtDT(t.last_offer_date)} <span style="color:var(--muted)">${t.last_offer_date_hijri??''}</span></dd>
      <dt>فتح العروض</dt><dd class="mono">${fmtDT(t.offers_opening_date)}</dd>
      <dt>رصدناها في</dt><dd class="mono">${fmtDT(t.detected_at)} (${latency(t.published_at,t.detected_at)})</dd>
    </dl>
    ${offers}${awards}`;
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });

$('#go').onclick = () => { offset = 0; loadTenders(); };
$('#q').addEventListener('keydown', e => { if(e.key==='Enter'){ offset=0; loadTenders(); }});
$('#prev').onclick = () => { offset = Math.max(0, offset-limit); loadTenders(); };
$('#next').onclick = () => { offset += limit; loadTenders(); };

loadStats(); loadFilters(); loadTenders();
setInterval(loadStats, 60_000);
</script>
</body>
</html>
