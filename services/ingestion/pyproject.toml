[project]
name = "thaqip-ingestion"
version = "0.1.0"
description = "Thaqip ingestion service: Etimad/Forsah connectors, normalization, delta detection"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29", "redis>=5.0"]
browser = [
    "playwright>=1.62.0",
]
docs = [
    "minio>=7.2.20",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thaqip_ingestion"]

[tool.ruff.lint]
ignore = ["C408", "E731"]
