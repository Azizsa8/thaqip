# Thaqip Agent Fleet Configuration
# Guaranteed-execution agent fleet for research, data collection, and operations

fleet:
  name: "thaqip-fleet"
  home: "/home/ais04/thaqip/agent-fleet"
  workdir: "/home/ais04/thaqip"
  
  # Persistence: fleet manager runs as a daemon
  daemon:
    enabled: true
    pid_file: "/home/ais04/thaqip/agent-fleet/var/fleet-daemon.pid"
    log_file: "/home/ais04/thaqip/agent-fleet/var/fleet-daemon.log"
    health_port: 8765
    api_port: 8766
    
  # Agent profiles - each is a Hermes profile with isolated config/memory/skills
  profiles:
    - name: "research-lead"
      title: "Research Lead"
      description: "Orchestrates multi-agent research operations, synthesizes findings"
      model: "nvidia/nemotron-3-ultra"
      provider: "nvidia"
      skills:
        - "web-search"
        - "arxiv"
        - "youtube-content"
        - "rss-feeds"
        - "competitor-news-monitor"
        - "grounded-citations"
      toolsets: ["web", "research", "skills", "terminal"]
      mcp_servers: []
      system_prompt_additions: |
        You are the Research Lead for Thaqip. Coordinate specialist agents to answer complex questions about Saudi government tenders, procurement regulations, market intelligence, and competitive landscapes. Always cite sources. Produce structured reports with executive summary, methodology, findings, and confidence scores.

    - name: "data-collector"
      title: "Data Collector"
      description: "Executes systematic data collection from web, APIs, documents, databases"
      model: "nvidia/nemotron-3-ultra"
      provider: "nvidia"
      skills:
        - "web-search"
        - "rss-feeds"
        - "pdf"
        - "xlsx"
        - "docx"
        - "product-price-monitor"
      toolsets: ["web", "terminal", "skills", "files"]
      mcp_servers: []
      system_prompt_additions: |
        You are a Data Collector for Thaqip. Execute precise data gathering tasks: scrape tender listings, extract document data, query APIs, compile datasets. Return structured data (JSON/CSV) with provenance metadata. Never hallucinate - if data is unavailable, report that clearly.

    - name: "tender-analyst"
      title: "Tender Analyst"
      description: "Deep analysis of tender documents, BOQs, compliance requirements, award patterns"
      model: "nvidia/nemotron-3-ultra"
      provider: "nvidia"
      skills:
        - "pdf"
        - "docx"
        - "xlsx"
        - "grounded-citations"
        - "baoyu-infographic"
      toolsets: ["terminal", "files", "skills", "web"]
      mcp_servers: []
      system_prompt_additions: |
        You are a Tender Analyst for Thaqip. Analyze Saudi tender documents (Etimad/Forsah): extract BOQs, compliance matrices, qualification requirements, evaluation criteria, award decisions. Know GTPL regulations. Output structured analysis ready for bid preparation.

    - name: "market-intelligence"
      title: "Market Intelligence"
      description: "Monitors competitors, tracks market trends, identifies opportunities"
      model: "nvidia/nemotron-3-ultra"
      provider: "nvidia"
      skills:
        - "competitor-news-monitor"
        - "rss-feeds"
        - "web-search"
        - "youtube-content"
        - "baoyu-infographic"
      toolsets: ["web", "research", "skills", "terminal"]
      mcp_servers: []
      system_prompt_additions: |
        You are Market Intelligence for Thaqip. Track competitor contract wins, pricing trends, agency procurement patterns, regulatory changes. Monitor Saudi Vision 2030 initiatives, NEOM, PIF projects. Deliver actionable intelligence briefs with source citations.

    - name: "operations-executor"
      title: "Operations Executor"
      description: "Runs operational workflows: backfills, reconciliation, alerts, migrations"
      model: "nvidia/nemotron-3-ultra"
      provider: "nvidia"
      skills:
        - "terminal"
        - "xlsx"
        - "pdf"
        - "document-to-action-items"
        - "meeting-action-items"
      toolsets: ["terminal", "files", "skills", "web"]
      mcp_servers: []
      system_prompt_additions: |
        You are an Operations Executor for Thaqip. Run reliable operational workflows: data backfills, reconciliation sweeps, alert triage, schema migrations, report generation. Every operation must be idempotent, logged, and produce a completion report with success/failure counts.

    - name: "code-engineer"
      title: "Code Engineer"
      description: "Implements features, fixes bugs, writes tests, refactors the Thaqip codebase"
      model: "nvidia/nemotron-3-ultra"
      provider: "nvidia"
      skills:
        - "claude-code"
        - "codex"
        - "opencode"
        - "test-driven-development"
        - "systematic-debugging"
        - "requesting-code-review"
      toolsets: ["terminal", "files", "skills", "web"]
      mcp_servers: []
      system_prompt_additions: |
        You are a Code Engineer for Thaqip. Work in the thaqip codebase (services/ingestion, services/console). Write tests first (TDD). Follow existing patterns: asyncpg, Pydantic, FastAPI, structured logging. Run pytest before committing. Output diffs and test results.

  # Operation templates - predefined multi-agent workflows
  operations:
    - id: "tender-deep-dive"
      name: "Tender Deep Dive"
      description: "Comprehensive analysis of a specific tender: documents, compliance, BOQ, competitors, award prediction"
      trigger: "api"  # or "cron", "webhook", "manual"
      schedule: null
      agents:
        - profile: "tender-analyst"
          task_template: |
            Analyze tender {tender_id} completely:
            1. Fetch all documents from Etimad/Forsah
            2. Extract BOQ with Arabic column detection
            3. Build compliance matrix (GTPL baseline + tender-specific)
            4. Identify qualification requirements and evaluation criteria
            5. Search for similar past tenders and award patterns
            6. Output: structured JSON with all findings + confidence scores
        - profile: "market-intelligence"
          task_template: |
            For tender {tender_id}, provide market context:
            1. Identify likely bidders from historical awards in same category/agency
            2. Analyze pricing trends for this work category
            3. Check for regulatory changes affecting this tender
            4. Output: competitor landscape + pricing benchmarks + risk factors
        - profile: "research-lead"
          task_template: |
            Synthesize the tender analysis from tender-analyst and market-intelligence into a final Deep Dive Report:
            - Executive summary (win probability, key risks, recommended bid strategy)
            - Compliance checklist (must-have vs nice-to-have)
            - BOQ analysis with cost drivers
            - Competitor profiles with historical win rates
            - Recommended next actions with owners and deadlines
      aggregation: "research-lead"  # which agent produces final output
      timeout_seconds: 1800
      retry_policy:
        max_attempts: 2
        backoff_seconds: 30

    - id: "daily-market-brief"
      name: "Daily Market Brief"
      description: "Morning briefing: new tenders, award announcements, competitor moves, regulatory updates"
      trigger: "cron"
      schedule: "0 6 * * *"  # 6 AM daily
      agents:
        - profile: "data-collector"
          task_template: |
            Collect data for daily brief (last 24 hours):
            1. New tenders from Etimad listing API (all categories)
            2. Award announcements from awards harvester
            3. Forsah new opportunities
            4. Output: raw JSON datasets with timestamps
        - profile: "market-intelligence"
          task_template: |
            Analyze collected data for daily brief:
            1. Top 10 new tenders by value/strategic fit
            2. Notable awards - who won, for what, at what price
            3. Competitor activity: new contract wins, hiring, partnerships
            4. Regulatory/news signals affecting procurement
            5. Output: structured brief sections
        - profile: "research-lead"
          task_template: |
            Compile the Daily Market Brief:
            - Header: date, summary stats (X new tenders, Y awards, Z competitors)
            - Section 1: Hot Tenders (table: ID, Agency, Category, Value, Deadline, Fit Score)
            - Section 2: Award Intelligence (winner, loser patterns, pricing)
            - Section 3: Competitor Moves
            - Section 4: Regulatory/Market Signals
            - Section 5: Recommended Actions for Today
            Deliver via Telegram/email/webhook
      aggregation: "research-lead"
      timeout_seconds: 600
      retry_policy:
        max_attempts: 3
        backoff_seconds: 60

    - id: "competitor-deep-dive"
      name: "Competitor Deep Dive"
      description: "Comprehensive profile of a specific competitor: win history, pricing, capabilities, team, strategy"
      trigger: "api"
      agents:
        - profile: "data-collector"
          task_template: |
            Gather all data on competitor {competitor_name}:
            1. All awarded tenders from database (query awards table)
            2. Web search for company news, leadership, projects
            3. Financial filings if public (Saudi stock exchange, etc.)
            4. Hiring signals (LinkedIn, job boards)
            5. Partnerships/JVs announced
        - profile: "market-intelligence"
          task_template: |
            Analyze competitor {competitor_name}:
            1. Win rate by category/agency/value band
            2. Pricing strategy: bid-to-budget ratios, discount patterns
            3. Technical capabilities from BOQ analysis of won tenders
            4. Team/key personnel from project references
            5. Strategic positioning: niche focus, expansion direction
        - profile: "research-lead"
          task_template: |
            Produce Competitor Profile Report for {competitor_name}:
            - Company overview (size, ownership, leadership, financials)
            - Win history analytics (charts: by year, category, agency, value)
            - Pricing model analysis with benchmarks
            - Capability map (what they bid on vs win)
            - Key personnel and org structure
            - Strategic assessment: strengths, weaknesses, likely moves
            - Counter-strategy recommendations for Thaqip
      aggregation: "research-lead"
      timeout_seconds: 1800

    - id: "regulatory-watch"
      name: "Regulatory Watch"
      description: "Monitor GTPL, Etimad, Forsah, Vision 2030 for changes affecting procurement"
      trigger: "cron"
      schedule: "0 */6 * * *"  # Every 6 hours
      agents:
        - profile: "data-collector"
          task_template: |
            Monitor regulatory sources:
            1. Etimad announcements page for rule changes
            2. Forsah policy updates
            3. Saudi Gazette (official journal) for GTPL amendments
            4. NCP (National Center for Privatization) publications
            5. Vision 2030/NDP portals for procurement-relevant initiatives
            6. Output: raw updates with URLs and timestamps
        - profile: "research-lead"
          task_template: |
            Analyze regulatory updates for impact:
            1. Classify: procedural, threshold, qualification, evaluation, digital
            2. Assess impact on Thaqip operations (ingestion, compliance, bidding)
            3. Identify action items: parser updates, schema changes, new data sources
            4. Output: Regulatory Impact Report with priority actions
      aggregation: "research-lead"
      timeout_seconds: 900

    - id: "code-implementation"
      name: "Code Implementation"
      description: "Implement a feature/fix in the Thaqip codebase with tests"
      trigger: "api"
      agents:
        - profile: "code-engineer"
          task_template: |
            Implement: {task_description}
            
            Context: Thaqip codebase at /home/ais04/thaqip
            - services/ingestion: Etimad/Forsah connectors, normalization, delta loop, war room
            - services/console: FastAPI + Typesense search UI
            - Stack: Python 3.12, uv, asyncpg, Pydantic, FastAPI, pgvector, Typesense
            - Tests: pytest in services/ingestion/tests/
            
            Requirements:
            1. Write tests FIRST (TDD) - failing tests that define expected behavior
            2. Implement minimal code to pass tests
            3. Follow existing patterns: structured logging, typed models, async throughout
            4. Run full test suite: cd services/ingestion && uv run pytest
            5. Output: git diff summary, test results, any migration needs
      aggregation: "code-engineer"
      timeout_seconds: 3600
      retry_policy:
        max_attempts: 2
        backoff_seconds: 60

    - id: "backfill-orchestration"
      name: "Historical Backfill Orchestration"
      description: "Run complete historical ingestion with checkpointing and verification"
      trigger: "api"
      agents:
        - profile: "operations-executor"
          task_template: |
            Execute full historical backfill of Etimad tenders:
            1. Run: cd services/ingestion && uv run python -m thaqip_ingestion.backfill --checkpoint
            2. Monitor progress via ingest_runs table
            3. Run reconciliation sweep: uv run python -m thaqip_ingestion.reconcile
            4. Run capture-rate audit: uv run python -m thaqip_ingestion.audit
            5. Output: completion report with stats (total tenders, duration, gaps found, audit score)
        - profile: "tender-analyst"
          task_template: |
            Verify backfill quality:
            1. Sample 50 tenders across time periods - verify document extraction
            2. Check BOQ parsing on construction tenders
            3. Verify entity resolution (agencies, vendors) consistency
            4. Output: quality report with pass/fail per check
      aggregation: "operations-executor"
      timeout_seconds: 7200
      retry_policy:
        max_attempts: 1
        backoff_seconds: 300

  # Delivery channels for operation results
  delivery:
    telegram:
      enabled: true
      bot_token_env: "TELEGRAM_BOT_TOKEN"
      default_chat_id_env: "TELEGRAM_CHAT_ID"
    webhook:
      enabled: true
      url_env: "FLEET_WEBHOOK_URL"
      secret_env: "FLEET_WEBHOOK_SECRET"
    email:
      enabled: false
    dashboard:
      enabled: true
      port: 8767

  # Monitoring & reliability
  monitoring:
    health_check_interval_seconds: 30
    operation_timeout_buffer_seconds: 60
    max_concurrent_operations: 5
    max_concurrent_agents_per_operation: 10
    result_retention_days: 30
    log_level: "INFO"
    
  # Database for operation tracking
  database:
    url_env: "DATABASE_URL"
    tables:
      operations: "fleet_operations"
      operation_agents: "fleet_operation_agents"
      operation_results: "fleet_operation_results"